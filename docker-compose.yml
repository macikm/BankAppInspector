services:
  bankapp-inspector:
    build: .
    image: ${IMAGE_NAME:-bankapp-inspector:latest}
    container_name: ${CONTAINER_NAME:-bankapp-inspector}
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Prague}
    env_file:
      - path: .env
        required: false
    ports:
      - "${HOST_PORT:-8087}:${PORT:-80}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "app=${CONTAINER_NAME:-bankapp-inspector}"
      - "maintainer=macikm"
