<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07151e"/>
      <stop offset="50%" stop-color="#052627"/>
      <stop offset="100%" stop-color="#021c1a"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="40%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#2dd4bf" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="108" fill="url(#glowGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Bank & Inspector Motif with Shadow - Enlarged for taskbar clarity -->
  <g filter="url(#shadowFilter)">
    <!-- Pediment / Triangular roof with modern apex -->
    <path d="M 256 50 L 444 146 C 454 151 454 163 444 165 L 68 165 C 58 163 58 151 68 146 Z" fill="url(#primaryGrad)"/>

    <!-- Small decorative emblem inside pediment: glowing pulse dot -->
    <circle cx="256" cy="125" r="14" fill="#042f2e" opacity="0.85"/>
    <circle cx="256" cy="125" r="8" fill="url(#accentGrad)" filter="url(#glowFilter)"/>

    <!-- Frieze / Entablature horizontal bar -->
    <rect x="74" y="174" width="364" height="24" rx="7" fill="url(#primaryGrad)"/>

    <!-- 4 Classic Bold Columns -->
    <rect x="94" y="210" width="48" height="175" rx="10" fill="url(#primaryGrad)"/>
    <rect x="180" y="210" width="48" height="175" rx="10" fill="url(#primaryGrad)"/>
    <rect x="284" y="210" width="48" height="175" rx="10" fill="url(#primaryGrad)"/>
    <rect x="370" y="210" width="48" height="175" rx="10" fill="url(#primaryGrad)"/>

    <!-- Podium / Base steps -->
    <rect x="66" y="395" width="380" height="28" rx="8" fill="url(#primaryGrad)"/>
    <rect x="44" y="431" width="424" height="34" rx="10" fill="url(#primaryGrad)"/>
  </g>

  <!-- Inspector / Radar / Lens Accent (Bottom Right) -->
  <g filter="url(#shadowFilter)">
    <!-- Outer radar circle -->
    <circle cx="376" cy="376" r="84" fill="#061c20" stroke="url(#borderGrad)" stroke-width="5"/>
    <circle cx="376" cy="376" r="66" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-dasharray="7 5" opacity="0.7"/>

    <!-- Magnifying Glass / Radar sweep -->
    <path d="M 350 354 A 36 36 0 1 1 396 406" fill="none" stroke="url(#primaryGrad)" stroke-width="10" stroke-linecap="round"/>
    <line x1="402" y1="402" x2="436" y2="436" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round"/>

    <!-- Glowing center checkmark / pulse beacon -->
    <circle cx="368" cy="368" r="11" fill="url(#accentGrad)" filter="url(#glowFilter)"/>
  </g>
</svg>
