<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1520"/>
      <stop offset="50%" stop-color="#062224"/>
      <stop offset="100%" stop-color="#02201d"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#2dd4bf" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#glowGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Bank & Inspector Motif with Shadow -->
  <g filter="url(#shadowFilter)">
    <!-- Pediment / Triangular roof with modern rounded apex -->
    <path d="M 256 96 L 396 174 C 404 178 404 188 396 190 L 116 190 C 108 188 108 178 116 174 Z" fill="url(#primaryGrad)"/>

    <!-- Small decorative emblem inside pediment: pulse dot -->
    <circle cx="256" cy="158" r="10" fill="#042f2e" opacity="0.8"/>
    <circle cx="256" cy="158" r="6" fill="url(#accentGrad)" filter="url(#glowFilter)"/>

    <!-- Frieze / Entablature horizontal bar -->
    <rect x="126" y="198" width="260" height="18" rx="6" fill="url(#primaryGrad)"/>

    <!-- 4 Classic Columns -->
    <rect x="142" y="226" width="34" height="136" rx="8" fill="url(#primaryGrad)"/>
    <rect x="206" y="226" width="34" height="136" rx="8" fill="url(#primaryGrad)"/>
    <rect x="272" y="226" width="34" height="136" rx="8" fill="url(#primaryGrad)"/>
    <rect x="336" y="226" width="34" height="136" rx="8" fill="url(#primaryGrad)"/>

    <!-- Podium / Base steps -->
    <rect x="120" y="372" width="272" height="20" rx="6" fill="url(#primaryGrad)"/>
    <rect x="104" y="398" width="304" height="24" rx="8" fill="url(#primaryGrad)"/>
  </g>

  <!-- Inspector / Radar / Lens Accent (Bottom Right) -->
  <g filter="url(#shadowFilter)">
    <!-- Outer radar circle -->
    <circle cx="352" cy="352" r="68" fill="#061c20" stroke="url(#borderGrad)" stroke-width="4"/>
    <circle cx="352" cy="352" r="54" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>

    <!-- Magnifying Glass / Radar sweep -->
    <path d="M 330 334 A 30 30 0 1 1 368 376" fill="none" stroke="url(#primaryGrad)" stroke-width="8" stroke-linecap="round"/>
    <line x1="373" y1="373" x2="400" y2="400" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Glowing center checkmark / pulse beacon -->
    <circle cx="346" cy="346" r="9" fill="url(#accentGrad)" filter="url(#glowFilter)"/>
  </g>
</svg>
